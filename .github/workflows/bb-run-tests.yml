name: bb run tests
on: [push, pull_request]
jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@9.4
        with:
          bb: latest
      - name: Install babashka dev build
        run: |
          bash <(curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install) --dev-build --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: |
          bb --version

          NEIL_GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
          NEIL_GITHUB_USER=${{ secrets.GITHUB_ACTOR }} bb run test:bb
